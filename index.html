<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <meta name="description" content="Albert 的工作基地。專案、筆記與對外窗口會放在這裡。" />
  <title>Albert的工作基地</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+TC:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script>
    if (sessionStorage.getItem("awb-auth") === "1") {
      document.documentElement.classList.add("is-authed");
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("app").hidden = false;
        document.getElementById("gate").hidden = true;
      });
    }
  </script>
</head>
<body>
  <main class="gate" id="gate">
    <form class="gate-card" id="login-form" autocomplete="on">
      <span class="mark" aria-hidden="true">A</span>
      <h1>Albert的工作基地</h1>
      <p>請登入後進入。</p>
      <div class="field">
        <label for="account">帳號</label>
        <input id="account" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="gate-error" id="login-error" role="alert"></p>
      <button class="gate-submit" type="submit">進入</button>
    </form>
  </main>

  <div class="wrap" id="app" hidden>
    <header class="top">
      <a class="brand" href="./">
        <span class="mark" aria-hidden="true">A</span>
        <span class="brand-name">ALBERT</span>
      </a>
      <div class="top-actions">
        <span class="pill">初版 · 2026</span>
        <button class="logout" id="logout" type="button">登出</button>
      </div>
    </header>

    <section class="hero">
      <h1>Albert的<br />工作基地</h1>
      <p>這是我的工作台第一版。之後會把進行中的專案、筆記，以及對外聯絡方式慢慢放上來。</p>
      <div class="meta">
        <div><b>狀態</b>建置中</div>
        <div><b>用途</b>個人工作入口</div>
        <div><b>託管</b>GitHub Pages</div>
      </div>
    </section>

    <section class="grid" aria-label="基地區塊">
      <article class="card">
        <h2>專案</h2>
        <p>進行中與已完成的工作會列在這裡。第一版先留位子。</p>
      </article>
      <article class="card">
        <h2>筆記</h2>
        <p>值得留下來的方法、紀錄與連結，之後會從這裡進出。</p>
      </article>
      <article class="card">
        <h2>聯絡</h2>
        <p>對外窗口稍後補上。現在這頁就是基地的門牌。</p>
      </article>
    </section>

    <section class="about">
      <h2>ABOUT</h2>
      <p>我是 Albert。這個網站是我對外的工作基地，用來放正在做的事，而不是一份完整履歷。內容會持續更新。</p>
    </section>

    <footer class="foot">Albert的工作基地 · 初版</footer>
  </div>
  <script src="auth.js?v=2"></script>
</body>
</html>
